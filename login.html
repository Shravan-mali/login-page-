<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="YouTube AI Agent - Sign in to manage your AI videos, YouTube channel and analytics."
  >

  <title>YouTube AI Agent - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background: #f7f7f8;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .card {
      width: 100%;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
    }

    /* =========================
       LOGO
    ========================= */

    .logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 16px;
      background: #111827;
      color: #ffffff;

      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    /* =========================
       TITLE
    ========================= */

    h1 {
      text-align: center;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 700;
      margin-bottom: 8px;
      color: #111827;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    /* =========================
       ERROR
    ========================= */

    .error {
      display: none;

      width: 100%;
      padding: 11px 12px;
      margin-bottom: 16px;

      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 9px;

      font-size: 13px;
      line-height: 1.4;
    }

    .error.show {
      display: block;
    }

    /* =========================
       FORM
    ========================= */

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 7px;

      font-size: 14px;
      font-weight: 600;
      color: #111827;
    }

    input {
      width: 100%;
      height: 48px;

      padding: 0 14px;

      border: 1px solid #d1d5db;
      border-radius: 10px;

      outline: none;

      background: #ffffff;
      color: #111827;

      font-size: 14px;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    input::placeholder {
      color: #9ca3af;
    }

    input:hover {
      border-color: #9ca3af;
    }

    input:focus {
      border-color: #111827;
      box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.08);
    }

    /* =========================
       BUTTONS
    ========================= */

    button {
      width: 100%;
      height: 48px;

      border-radius: 10px;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;

      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.1s ease,
        opacity 0.2s ease;
    }

    button:active {
      transform: scale(0.99);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* =========================
       EMAIL BUTTON
    ========================= */

    .email-btn {
      margin-top: 2px;
      margin-bottom: 20px;

      border: none;

      background: #111827;
      color: #ffffff;
    }

    .email-btn:hover {
      background: #1f2937;
    }

    /* =========================
       DIVIDER
    ========================= */

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;

      margin-bottom: 20px;

      color: #9ca3af;

      font-size: 12px;
      font-weight: 500;
    }

    .divider::before,
    .divider::after {
      content: "";

      flex: 1;
      height: 1px;

      background: #e5e7eb;
    }

    /* =========================
       SOCIAL BUTTONS
    ========================= */

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      margin-bottom: 12px;

      background: #ffffff;
      color: #111827;

      border: 1px solid #d1d5db;
    }

    .social-btn:hover {
      background: #f9fafb;
      border-color: #9ca3af;
    }

    /* =========================
       SOCIAL ICONS
    ========================= */

    .google-icon,
    .apple-icon {
      width: 20px;
      height: 20px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;
    }

    .google-icon {
      font-size: 18px;
      font-weight: 700;
      color: #4285f4;
    }

    .apple-icon svg {
      width: 19px;
      height: 19px;
      display: block;
      fill: #111827;
    }

    /* =========================
       SIGN UP
    ========================= */

    .switch {
      margin-top: 22px;

      text-align: center;

      color: #6b7280;

      font-size: 13px;
      line-height: 1.5;
    }

    .switch span {
      color: #111827;

      font-weight: 600;

      cursor: pointer;
    }

    .switch span:hover {
      text-decoration: underline;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 480px) {

      body {
        padding: 16px;
      }

      .card {
        padding: 30px 24px;
        border-radius: 18px;
      }

      h1 {
        font-size: 25px;
      }

      .logo {
        width: 54px;
        height: 54px;
      }
    }
  </style>
</head>


<body>

  <main class="container">

    <section class="card">

      <!-- =========================
           LOGO
      ========================== -->

      <div
        class="logo"
        aria-label="YouTube AI Agent">

        AI

      </div>


      <!-- =========================
           TITLE
      ========================== -->

      <h1>
        Welcome back
      </h1>

      <p class="subtitle">
        Sign in to your YouTube AI Agent
      </p>


      <!-- =========================
           ERROR MESSAGE
      ========================== -->

      <div
        id="error"
        class="error"
        role="alert"
        aria-live="polite">
      </div>


      <!-- =========================
           EMAIL LOGIN
      ========================== -->

      <form
        id="emailForm"
        novalidate>

        <div class="form-group">

          <label for="email">
            Email address
          </label>

          <input
            id="email"
            name="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            name="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          id="emailLoginBtn"
          class="email-btn"
          type="submit">

          Continue with Email

        </button>

      </form>


      <!-- =========================
           DIVIDER
      ========================== -->

      <div class="divider">
        <span>OR</span>
      </div>


      <!-- =========================
           GOOGLE LOGIN
      ========================== -->

      <button
        id="googleBtn"
        class="social-btn google-btn"
        type="button"
        aria-label="Continue with Google">

        <span
          class="google-icon"
          aria-hidden="true">

          G

        </span>

        <span>
          Continue with Google
        </span>

      </button>


      <!-- =========================
           APPLE LOGIN
      ========================== -->

      <button
        id="appleBtn"
        class="social-btn apple-btn"
        type="button"
        aria-label="Continue with Apple">

        <span
          class="apple-icon"
          aria-hidden="true">

          <!-- Apple Logo -->
          <svg
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg">

            <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25C11.88 5.02 13.69 3.18 15.86 3c.3 2.58-2.34 4.5-3.83 4.25z"/>

          </svg>

        </span>

        <span>
          Continue with Apple
        </span>

      </button>


      <!-- =========================
           SIGN UP
      ========================== -->

      <div class="switch">

        Don't have an account?

        <span
          id="signup"
          role="button"
          tabindex="0">

          Create account

        </span>

      </div>

    </section>

  </main>


  <!-- =========================
       AUTH JAVASCRIPT
  ========================== -->

  <script
    type="module"
    src="./js/auth.js">
  </script>

</body>

</html>
